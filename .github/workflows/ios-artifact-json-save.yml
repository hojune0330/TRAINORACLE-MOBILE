name: Existing R5 iOS actual native JSON save (separate simulator UI runner)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-local-json-save:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-simulator-candidate-38846323960
          run-id: 38846323960
          github-token: ${{ github.token }}
          path: publisher/candidate-input
      - name: Build only the separate UI harness; tap actual export and local Files Save
        run: bash scripts/run-ios-artifact-json-save.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-actual-json-save-${{ github.run_id }}
          path: publisher/output/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
