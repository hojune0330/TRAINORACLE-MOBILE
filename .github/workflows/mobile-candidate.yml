name: Mobile candidate (no signing or store upload)

on:
  workflow_dispatch:
    inputs:
      platforms:
        type: choice
        description: Native candidate targets
        options: [both, android, ios]
        default: both

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hojune0330/TRAINORACLE
          ref: 0b3c12f67617ff610005dbb558388c4b5899bb83
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/generate-assets.mjs
      - name: Wrapper-only tests (not original source regression)
        run: npm test
      - name: Immutable offline source build and native adapter bundle
        run: node scripts/prepare-release.mjs --source ../upstream
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-web-${{ github.run_id }}
          path: publisher/www/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  android:
    needs: web
    if: inputs.platforms == 'both' || inputs.platforms == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-web-${{ github.run_id }}
          path: publisher/www
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate isolated Android project
        run: node scripts/generate-native.mjs --platform android
      - name: Ensure Android 36 SDK
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Build test APK and unsigned release AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:bundleRelease
      - name: Collect Android candidate and verify IDs and SDK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/TrainOracle-android-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab output/TrainOracle-android-UNSIGNED.aab
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging output/TrainOracle-android-test.apk > output/android-test-badging.txt
          grep -q "name='io.trainoracle.app.debug'" output/android-test-badging.txt
          grep -q "targetSdkVersion:'36'" output/android-test-badging.txt
          grep -q "sdkVersion:'26'" output/android-test-badging.txt
          cp www/trainoracle-mobile-receipt.json output/web-build-receipt.json
          printf '%s\n' 'TEST APK: separate .debug application ID. AAB: UNSIGNED, not ready for Play upload. No signing keys or store upload were used.' > output/ANDROID-SCOPE.txt
      - name: Real Android WebView capabilities and reinstall persistence
        run: bash scripts/run-android-runtime.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-candidate-${{ github.run_id }}
          path: publisher/output/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9

  ios:
    needs: web
    if: inputs.platforms == 'both' || inputs.platforms == 'ios'
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mobile-web-${{ github.run_id }}
          path: publisher/www
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Xcode 26 and iOS 26 SDK or newer
        run: |
          mkdir -p output
          xcodebuild -version > output/xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version > output/ios-sdk-version.txt
          node --input-type=module -e "import fs from 'node:fs';const x=fs.readFileSync('output/xcode-version.txt','utf8');const s=fs.readFileSync('output/ios-sdk-version.txt','utf8');if(Number(x.match(/Xcode (\d+)/)?.[1]||0)<26||!/^\d+(?:\.\d+)*$/.test(s.trim())||Number(s.split('.')[0])<26)throw Error('Xcode/iOS SDK 26 minimum not met');"
      - name: Generate isolated iOS project
        run: node scripts/generate-native.mjs --platform ios
      - name: Compile simulator app (not an App Store IPA)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/trainoracle-derived" CODE_SIGNING_ALLOWED=NO build > output/ios-build.log 2>&1 || { tail -n 100 output/ios-build.log; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/trainoracle-derived/Build/Products/Debug-iphonesimulator/App.app" output/TrainOracle-ios-SIMULATOR.zip
      - name: Real WebKit capability, storage and reinstall persistence probe
        run: |
          xcrun simctl list devices available --json > output/simulators.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('output/simulators.json','utf8')).devices;
          const runtimes=Object.keys(d).filter(k=>k.includes('.iOS-')).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
          let found;
          for(const r of runtimes){const devices=d[r].filter(x=>x.isAvailable&&x.name.includes('iPhone'));found=devices.find(x=>x.name.includes('Pro Max'))||devices[0];if(found)break;}
          if(!found)throw Error('Available iPhone simulator required');
          fs.writeFileSync('output/simulator-udid.txt',found.udid);
          NODE
          DEVICE=$(cat output/simulator-udid.txt)
          APP="$RUNNER_TEMP/trainoracle-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" "$APP"
          SIMCTL_CHILD_TRAINORACLE_NATIVE_PROBE=write xcrun simctl launch --terminate-running-process "$DEVICE" io.trainoracle.app.debug
          DATA=$(xcrun simctl get_app_container "$DEVICE" io.trainoracle.app.debug data)
          for i in {1..80}; do [ -f "$DATA/Documents/native-release-probe.json" ] && break; sleep 1; done
          cp "$DATA/Documents/native-release-probe.json" output/native-ios-probe-write.json
          xcrun simctl terminate "$DEVICE" io.trainoracle.app.debug
          xcrun simctl install "$DEVICE" "$APP"
          rm "$DATA/Documents/native-release-probe.json"
          SIMCTL_CHILD_TRAINORACLE_NATIVE_PROBE=read xcrun simctl launch --terminate-running-process "$DEVICE" io.trainoracle.app.debug
          for i in {1..80}; do [ -f "$DATA/Documents/native-release-probe.json" ] && break; sleep 1; done
          cp "$DATA/Documents/native-release-probe.json" output/native-ios-probe-read.json
          xcrun simctl io "$DEVICE" screenshot output/trainoracle-ios-actual.png
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('output/native-ios-probe-read.json','utf8'));
          const keys=['probeReady','secureContext','locksAvailable','cryptoAvailable','indexedDBAvailable','localStorageAvailable','nativeDocumentsAvailable','appPluginAvailable','realLock','cryptoRoundTrip','localStorageRoundTrip','indexedDBRoundTrip','localStoragePersistence','indexedDBPersistence','rootRendered','coreContentPresent'];
          const failed=keys.filter(k=>p[k]!==true);
          if(p.storageStage!=='read'||p.storageFailureVisible!==false||failed.length)throw Error('Real native probe failed: '+failed.join(','));
          console.log('Real WebKit capabilities and probe-owned persistence passed. No original user records or source regression pass claimed.');
          NODE
          cp www/trainoracle-mobile-receipt.json output/web-build-receipt.json
          printf '%s\n' 'SIMULATOR ONLY: not a signed App Store IPA. Probe writes only dedicated test keys/database in a fresh simulator sandbox; never original browser storage. Original regression gate remains separate.' > output/IOS-SCOPE.txt
      - name: Capture available simulator state on failure
        if: failure()
        run: |
          if [ -f output/simulator-udid.txt ]; then xcrun simctl io "$(cat output/simulator-udid.txt)" screenshot output/trainoracle-ios-failure.png || true; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-simulator-candidate-${{ github.run_id }}
          path: publisher/output/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
