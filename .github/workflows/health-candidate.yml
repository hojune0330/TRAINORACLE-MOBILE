name: UNREVIEWED health candidate (unsigned compile only)
on:
  workflow_dispatch:
    inputs:
      enable_health:
        type: boolean
        description: Explicit opt-in to UNREVIEWED health compile candidate
        required: true
        default: false
      enable_offline_preview:
        type: boolean
        description: Explicit opt-in to offline readonly preview only (no account/import/API integration)
        required: true
        default: false
      platforms:
        type: choice
        options: [both, android, ios]
        default: both
permissions:
  contents: read
concurrency:
  group: health-candidate-${{ github.ref }}-${{ inputs.platforms }}
  cancel-in-progress: false
jobs:
  web:
    if: inputs.enable_health == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: publisher
          persist-credentials: false
      - name: Resolve pinned offline source
        id: source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('release-config.json', 'utf8'));
          if (r.sourceRepository !== 'hojune0330/TRAINORACLE' || !/^[a-f0-9]{40}$/.test(r.sourceSha) || r.accountMode !== 'off' || r.signingConfigured !== false || r.storeUploadEnabled !== false) throw Error('Pinned offline candidate required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + r.sourceSha + '\n');
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hojune0330/TRAINORACLE
          ref: ${{ steps.source.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/generate-assets.mjs
      - name: Original wrapper gates and health helper fixtures (not device validation)
        run: npm test
      - name: Immutable pinned original and offline adapter build
        env:
          ENABLE_OFFLINE_PREVIEW: ${{ inputs.enable_offline_preview }}
        run: |
          args=(--source ../upstream)
          if [ "$ENABLE_OFFLINE_PREVIEW" = 'true' ]; then args+=(--offline-health-preview); fi
          node scripts/prepare-release.mjs "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: health-web-${{ github.run_id }}
          path: publisher/www/
          if-no-files-found: error
          retention-days: 1
  android:
    needs: web
    if: inputs.platforms == 'both' || inputs.platforms == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: health-web-${{ github.run_id }}
          path: publisher/www
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/configure-health.test.mjs scripts/configure-android-health.test.mjs scripts/generate-health-candidate.test.mjs
      - name: Generate android health scaffold or explicit offline preview
        env:
          ENABLE_OFFLINE_PREVIEW: ${{ inputs.enable_offline_preview }}
        run: |
          args=(--enable-health --platform android)
          if [ "$ENABLE_OFFLINE_PREVIEW" = 'true' ]; then args+=(--enable-offline-preview); fi
          node scripts/generate-health-candidate.mjs "${args[@]}"
      - name: Unsigned release compile only, no device or UI launch
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then sdkmanager 'platforms;android-36' 'build-tools;36.0.0'; fi
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon --console=plain :app:bundleRelease) > output/health-android-build.log 2>&1 || { tail -n 100 output/health-android-build.log; exit 1; }
          test -s android/app/build/outputs/bundle/release/app-release.aab
          if unzip -Z1 android/app/build/outputs/bundle/release/app-release.aab | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then echo 'Unexpected signing'; exit 1; fi
          cp android/app/build/outputs/bundle/release/app-release.aab output/TrainOracle-health-UNREVIEWED-UNSIGNED.aab
          printf '%s\n' '{"reviewStatus":"UNREVIEWED","nativeCompilation":"passed","runtimeValidation":"not-executed","signingConfigured":false,"storeUploadEnabled":false}' > output/health-compile-android.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: health-android-UNREVIEWED-${{ github.run_id }}
          path: publisher/output/
          if-no-files-found: error
          retention-days: 1
  ios:
    needs: web
    if: inputs.platforms == 'both' || inputs.platforms == 'ios'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 35
    defaults:
      run:
        working-directory: publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: health-web-${{ github.run_id }}
          path: publisher/www
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/configure-health.test.mjs scripts/configure-android-health.test.mjs scripts/generate-health-candidate.test.mjs
      - name: Generate ios health scaffold or explicit offline preview
        env:
          ENABLE_OFFLINE_PREVIEW: ${{ inputs.enable_offline_preview }}
        run: |
          args=(--enable-health --platform ios)
          if [ "$ENABLE_OFFLINE_PREVIEW" = 'true' ]; then args+=(--enable-offline-preview); fi
          node scripts/generate-health-candidate.mjs "${args[@]}"
      - name: Unsigned generic iOS compile only, no simulator or device launch
        run: |
          xcodebuild -version > output/health-xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version > output/health-sdk-version.txt
          node --input-type=module -e "import fs from 'node:fs';if(Number(fs.readFileSync('output/health-xcode-version.txt','utf8').match(/Xcode (\d+)/)?.[1]||0)<26||Number(fs.readFileSync('output/health-sdk-version.txt','utf8').trim().split('.')[0])<26)throw Error('Xcode/iOS 26 required');"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/trainoracle-health-derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > output/health-ios-build.log 2>&1 || { tail -n 100 output/health-ios-build.log; exit 1; }
          APP="$RUNNER_TEMP/trainoracle-health-derived/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          test ! -d "$APP/_CodeSignature"
          if codesign -dv "$APP" 2>/dev/null; then echo 'Unexpected signing'; exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" output/TrainOracle-health-UNREVIEWED-UNSIGNED-app.zip
          printf '%s\n' '{"reviewStatus":"UNREVIEWED","nativeCompilation":"passed","runtimeValidation":"not-executed","signingConfigured":false,"storeUploadEnabled":false}' > output/health-compile-ios.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: health-ios-UNREVIEWED-${{ github.run_id }}
          path: publisher/output/
          if-no-files-found: error
          retention-days: 1
